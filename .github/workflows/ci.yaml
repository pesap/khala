name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      # Lint here; the test step's build (clean + tsc) is the authoritative type gate,
      # so a separate --noEmit typecheck pass would be redundant build work.
      - run: npm run lint
      - run: npm run test
      # Package artifact validation moved from the pre-push hook to the CI gate.
      - run: npm pack --dry-run
