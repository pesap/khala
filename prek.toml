# Install hooks:
#   prek install --hook-type pre-commit --hook-type pre-push
#
# Run all hooks manually:
#   prek run --all-files
#
# Intended for a modern TypeScript Pi extension using:
#   - Biome
#   - TypeScript
#   - Vitest
#   - npm
#
# package.json owns the repository checks invoked by these hooks.

minimum_prek_version = "0.3.2"

default_install_hook_types = [
  "pre-commit",
  "pre-push",
]


# ---------------------------------------------------------------------------
# Repository hygiene
#
# These are native prek hooks, so they do not require cloning another
# pre-commit repository or creating another runtime environment.
# ---------------------------------------------------------------------------

[[repos]]
repo = "builtin"

hooks = [
  # Basic file hygiene.
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },

  # Prevent unresolved Git merge artifacts.
  { id = "check-merge-conflict" },

  # Catch filenames that behave differently across case-sensitive and
  # case-insensitive filesystems.
  { id = "check-case-conflict" },

  # Validate common configuration formats.
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-toml" },

  # Avoid accidentally committing generated artifacts, datasets, binaries,
  # logs, or other large files.
  { id = "check-added-large-files", args = ["--maxkb=1000"] },

  # Cheap first line of defense against accidentally committed credentials.
  { id = "detect-private-key" },
]


# ---------------------------------------------------------------------------
# TypeScript / Pi extension hooks
#
# package.json owns tool versions and commands.
# prek only decides when those commands run.
# ---------------------------------------------------------------------------

[[repos]]
repo = "local"


# ---------------------------------------------------------------------------
# Oxlint
#
# Run the repository-configured Oxlint rules for the complete codebase. The
# command owns its file selection through oxlint.config.ts, so it must not be
# narrowed to the files passed by prek.
# ---------------------------------------------------------------------------

[[repos.hooks]]
id = "oxlint"
name = "oxlint"
entry = "npm run lint:oxlint"
language = "system"

pass_filenames = false
always_run = true

stages = [
  "pre-commit",
]


# ---------------------------------------------------------------------------
# Biome
#
# Runs only against TypeScript files covered by biome.json.
#
# `npm run lint:fix --` allows prek to append the filenames being checked.
# ---------------------------------------------------------------------------

[[repos.hooks]]
id = "biome"
name = "biome"
entry = "npm run lint:fix --"
language = "system"

files = '''
(?x)^(
  src/.*\.(ts|tsx|mts|cts)|
  extensions/pi-review/.*\.(ts|tsx|mts|cts)
)$
'''

stages = [
  "pre-commit",
]


# ---------------------------------------------------------------------------
# Tests
#
# npm test builds first (clean + tsc) and then runs the complete suite, so the
# build is the authoritative type gate; the typecheck and package-check hooks
# were redundant with it and were removed.
# ---------------------------------------------------------------------------

[[repos.hooks]]
id = "markdown-sentences"
name = "markdown sentence-per-line"
entry = "npm run check:markdown"
language = "system"

pass_filenames = false
always_run = true

stages = [
  "pre-commit",
]


[[repos.hooks]]
id = "test"
name = "test"
# Git exports repository-local variables to pre-push hooks. Tests create nested
# repositories, so remove those bindings before they invoke Git.
entry = "env -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_CONFIG -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_OBJECT_DIRECTORY -u GIT_DIR -u GIT_WORK_TREE -u GIT_IMPLICIT_WORK_TREE -u GIT_GRAFT_FILE -u GIT_INDEX_FILE -u GIT_NO_REPLACE_OBJECTS -u GIT_REPLACE_REF_BASE -u GIT_PREFIX -u GIT_INTERNAL_SUPER_PREFIX -u GIT_SHALLOW_FILE -u GIT_COMMON_DIR npm test"
language = "system"

pass_filenames = false
always_run = true

stages = [
  "pre-push",
]


# ---------------------------------------------------------------------------
# prek configuration validation
# ---------------------------------------------------------------------------

[[repos]]
repo = "meta"

hooks = [
  # Catch hooks whose file filters can never match anything in the repository.
  { id = "check-hooks-apply" },

  # Catch excludes that do not affect any configured hook.
  { id = "check-useless-excludes" },
]
